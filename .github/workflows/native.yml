# The Android app (native/: the game's own code drawn by React Native), built on every change
# to it or to the game: the APK to install and the AAB for the Play Store, kept as the run's
# artifact (Actions → this run → « babi-life-native-apk »). Signed with the same release key as
# the old Flutter app (mobile.yml), and numbered above it, so it installs over it on the phones
# and Google sign-in knows it (native/README.md).
name: Native app

on:
  push:
    # Only the app's own changes (the repository is private: Actions minutes count); a game change
    # reaches the app when it's built by hand (Actions → Native app → Run workflow).
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    env:
      # The API, and the Google sign-in's web client (the Firebase project's, public, as the old app had it in mobile/lib/config.dart).
      EXPO_PUBLIC_API_URL: https://babi-life-jnvy.onrender.com/api/v1
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '115685300024-jo2jvvpg0p1ue1gsv156lcmkjjb99s9t.apps.googleusercontent.com' }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      # The version number Android and the Play Store compare: this run's, above the old app's (2).
      - run: echo "ANDROID_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      # Firebase (the notifications) and Google's sign-in: the Firebase console's google-services.json of the
      # Android app com.lifeinbabi.babi_life, pasted whole into the repository's secret or variable
      # GOOGLE_SERVICES_JSON (public identifiers, in every installed app anyway: its oauth_client entries say
      # which signing keys Google knows, native/README.md). Without it, a file made from FCM_APP_ID and
      # FCM_API_KEY, with the Android OAuth clients Firebase gave once the two SHA-1s were added (the release
      # key's 43:58:…:3F and Google Play's app-signing key's 35:91:…:B6) and the web client.
      - name: Firebase
        env:
          SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
          APP_ID: ${{ vars.FCM_APP_ID || '1:115685300024:android:9d87f4913fe5f373b3d3cd' }}
          API_KEY: ${{ vars.FCM_API_KEY || 'AIzaSyCWL8bpyY5sPd7RhT-AopRpibfhbrIbsgY' }}
        run: |
          if [ -n "$SERVICES_JSON" ]; then
            printf '%s' "$SERVICES_JSON" > google-services.json
            # The right file: valid JSON, for this app; what Google knows of its keys said in the log.
            node -e '
              const j = JSON.parse(require("fs").readFileSync("google-services.json", "utf8"))
              const c = j.client.find((c) => c.client_info.android_client_info.package_name === "com.lifeinbabi.babi_life")
              if (!c) { console.error("::error::GOOGLE_SERVICES_JSON has no Android app com.lifeinbabi.babi_life"); process.exit(1) }
              const android = c.oauth_client.filter((o) => o.client_type === 1)
              console.log("google-services.json: " + android.length + " Android OAuth client(s), SHA-1 " + android.map((o) => o.android_info && o.android_info.certificate_hash).join(", "))
              if (!android.length) console.log("::warning::google-services.json has no Android OAuth client: Google sign-in will fail (code 10) until the SHA-1s are added in Firebase (native/README.md)")
            '
            exit 0
          fi
          [ -n "$APP_ID" ] && [ -n "$API_KEY" ] || exit 0
          cat > google-services.json <<JSON
          {"project_info":{"project_number":"115685300024","project_id":"babilife-38e39","storage_bucket":"babilife-38e39.firebasestorage.app"},
           "client":[{"client_info":{"mobilesdk_app_id":"$APP_ID","android_client_info":{"package_name":"com.lifeinbabi.babi_life"}},
            "oauth_client":[
             {"client_id":"115685300024-fsj7k7qhlsra1f8clevfjmlo03f3lh69.apps.googleusercontent.com","client_type":1,"android_info":{"package_name":"com.lifeinbabi.babi_life","certificate_hash":"4358aad1e45b9cc95e6ff8cdaefe8866c95d7c3f"}},
             {"client_id":"115685300024-6fq8p3pbmcg89uqf5b624cg32neini76.apps.googleusercontent.com","client_type":1,"android_info":{"package_name":"com.lifeinbabi.babi_life","certificate_hash":"3591dcdae87d4df6846e15336d58e08e021a12b6"}},
             {"client_id":"115685300024-jo2jvvpg0p1ue1gsv156lcmkjjb99s9t.apps.googleusercontent.com","client_type":3}],
            "api_key":[{"current_key":"$API_KEY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"115685300024-jo2jvvpg0p1ue1gsv156lcmkjjb99s9t.apps.googleusercontent.com","client_type":3}]}}}],
           "configuration_version":"1"}
          JSON
      # The game bundles for the phone (a missing twin or package shows here, before Gradle).
      - run: npx expo export --platform android --output-dir /tmp/bundle-check
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        working-directory: native/android
      # The release key, from the repository's secrets (ANDROID_KEYSTORE: the .jks in base64,
      # ANDROID_KEY_PASSWORD); without them the APK keeps the build's own key (fine to try, not to publish).
      - name: Sign
        working-directory: native/android/app/build/outputs
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/out
          if [ -z "$KEYSTORE" ]; then mv apk/release/app-release.apk /tmp/out/babi-life-native.apk; mv bundle/release/app-release.aab /tmp/out/babi-life-native.aab; exit 0; fi
          echo "$KEYSTORE" | base64 -d > /tmp/babi-life.jks
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/zipalign" -f -p 4 apk/release/app-release.apk /tmp/aligned.apk
          "$TOOLS/apksigner" sign --ks /tmp/babi-life.jks --ks-key-alias babi-life --ks-pass env:PASSWORD --key-pass env:PASSWORD --out /tmp/out/babi-life-native.apk /tmp/aligned.apk
          # The Play Store's bundle: signed by jarsigner with the same key (the store re-signs what it hands out).
          jarsigner -keystore /tmp/babi-life.jks -storepass:env PASSWORD -keypass:env PASSWORD -signedjar /tmp/out/babi-life-native.aab bundle/release/app-release.aab babi-life
          rm -f /tmp/babi-life.jks /tmp/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: babi-life-native-apk
          path: /tmp/out/babi-life-native.*
          retention-days: 30
