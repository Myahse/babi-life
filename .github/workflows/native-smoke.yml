# The Android app opened in an emulator: built for the emulator's processor (x86_64), installed,
# launched, and what the phone said kept (logcat: a crash at start shows here, with its cause).
# Run on every change to the app (or by hand: Actions → Native app in the emulator → Run workflow).
name: Native app in the emulator

on:
  push:
    paths: ['native/**', '.github/workflows/native-smoke.yml']
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    # (contents: write: the screenshots pushed to the smoke-shots branch, below.)
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    env:
      EXPO_PUBLIC_API_URL: https://babi-life-jnvy.onrender.com/api/v1
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '115685300024-jo2jvvpg0p1ue1gsv156lcmkjjb99s9t.apps.googleusercontent.com' }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Firebase
        run: |
          cat > google-services.json <<JSON
          {"project_info":{"project_number":"115685300024","project_id":"babilife-38e39","storage_bucket":"babilife-38e39.firebasestorage.app"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:115685300024:android:9d87f4913fe5f373b3d3cd","android_client_info":{"package_name":"com.lifeinbabi.babi_life"}},
            "oauth_client":[],"api_key":[{"current_key":"AIzaSyCWL8bpyY5sPd7RhT-AopRpibfhbrIbsgY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
           "configuration_version":"1"}
          JSON
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: native/android
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: native
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.lifeinbabi.babi_life -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > /tmp/screen-25s.png
            sleep 50
            adb shell pidof com.lifeinbabi.babi_life && echo "APP STILL RUNNING" || echo "APP NOT RUNNING"
            adb exec-out screencap -p > /tmp/screen.png
            adb logcat -d > /tmp/logcat.txt
            echo "----- the shell and the page -----"
            grep -E "\[shell\]|chromium|cr_|Console" /tmp/logcat.txt | grep -v "AWNetworkFetcher\|gvt1" | head -80
            echo "----- errors -----"
            grep -E "AndroidRuntime|ReactNativeJS|FATAL|Exception|Error" /tmp/logcat.txt | grep -iv "chatty" | head -300
      # The crash's stack, from the bundle's positions to the game's files and lines.
      - name: Symbolicate
        if: always()
        run: |
          MAP=$(ls android/app/build/generated/sourcemaps/react/release/*.map 2>/dev/null | head -1)
          [ -n "$MAP" ] && [ -f /tmp/logcat.txt ] || exit 0
          cp "$MAP" /tmp/bundle.map
          grep -A80 "FATAL EXCEPTION" /tmp/logcat.txt | sed -n 's/.*AndroidRuntime: \(.*\)@1:\([0-9]*\)$/    at \1 (address at index.android.bundle:1:\2)/p' | head -40 > /tmp/stack.txt || true
          cat /tmp/stack.txt
          echo "----- symbolicated -----"
          npx metro-symbolicate /tmp/bundle.map < /tmp/stack.txt | tee /tmp/stack-src.txt || true
      # The screenshots also on the smoke-shots branch (one commit, replaced each time): a coding session that
      # can't reach Actions' downloads looks at them with git.
      - name: The screenshots on smoke-shots
        if: always() && github.ref == 'refs/heads/claude/modest-fermat-904lhi'
        working-directory: /tmp
        run: |
          mkdir /tmp/shots && cp /tmp/screen*.png /tmp/shots/ 2>/dev/null || true
          grep -E "\[shell\]|ReactNativeJS" /tmp/logcat.txt > /tmp/shots/shell.txt 2>/dev/null || true
          cd /tmp/shots && git init -q -b smoke-shots && git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Emulator of ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logcat
          path: |
            /tmp/logcat.txt
            /tmp/screen.png
            /tmp/stack-src.txt
            /tmp/bundle.map
          retention-days: 7
