# Render's free instance sleeps after about 15 minutes with no traffic.
# This runs on the default branch and hits /healthz often enough to keep it awake.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 70 https://babi-life-jnvy.onrender.com/healthz; then
              exit 0
            fi
            sleep 15
          done
          exit 1
