# The Android app played through in an emulator. The app is the website's game in a web view (native/
# Shell.tsx): here it opens the review's own copy of the site (web/ built and served in the runner) and
# the review's own API (a Postgres and the Go server started here, every update opened as the admin opens
# them; never production). native/review/drive.mjs drives the game from inside the web view (Playwright,
# through its DevTools socket, on in this build only) and the phone from outside (adb: back, turning):
# the sign-in screen, the arrival, the street, the phone, the map, landscape, the back button. The phone's
# screen at every step, its log and the app's JavaScript errors are kept as the run's artifact
# « native-review », and the screenshots pushed to the review-shots branch.
name: Native app review

on:
  push:
    paths: ['.github/workflows/native-review.yml', 'native/review/**', 'native/Shell.tsx']
  workflow_dispatch:
    inputs:
      parts:
        description: 'What to play: login (the welcome, the sign-in, an e-mail account, the birth) or full (the whole game)'
        default: login

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # (contents: write: the screenshots pushed to the review-shots branch.)
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: review
          POSTGRES_DB: babi
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: native
    env:
      # The site and the API as the emulator reaches the runner (10.0.2.2), over plain HTTP: allowed for
      # that host in this build only (app.config.js, REVIEW_CLEARTEXT_HOST). EXPO_PUBLIC_REVIEW: the web
      # view's DevTools socket on, for drive.mjs.
      EXPO_PUBLIC_GAME_URL: http://10.0.2.2:5173/jeu
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8080/api/v1
      EXPO_PUBLIC_REVIEW: '1'
      REVIEW_CLEARTEXT_HOST: 10.0.2.2
      PGURL: postgres://postgres:review@localhost:5432/babi?sslmode=disable
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '115685300024-jo2jvvpg0p1ue1gsv156lcmkjjb99s9t.apps.googleusercontent.com' }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      # A throwaway key for this run's own server (nothing else knows it).
      ADMIN_KEY: review-only-admin-key
      API: http://localhost:8080/api/v1
      OUT: /tmp/review
      # native/review/drive.py's parts (a push plays the sign-in's).
      REVIEW_PARTS: ${{ inputs.parts || 'login' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: API
        working-directory: backend
        run: |
          mkdir -p "$OUT"
          go build -o /tmp/api ./cmd/api
          # Migrations run as it starts. DEV_LOGIN: the title's « Mode test » sign-in; GAME_OPEN: no wish list.
          DATABASE_URL='postgres://postgres:review@localhost:5432/babi?sslmode=disable' \
          JWT_SECRET=review-secret-review-secret-review-0123 PORT=8080 DEV_LOGIN=true GAME_OPEN=true \
          ALLOWED_ORIGINS=http://10.0.2.2:5173 \
            nohup /tmp/api > "$OUT/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/healthz && break; sleep 2; done
          curl -fs http://localhost:8080/healthz || { cat "$OUT/api.log"; exit 1; }
      # Every update opened, as the admin's « Mises à jour » would (players see the whole game).
      - name: Open the updates
        run: |
          curl -fs -H "X-Admin-Key: $ADMIN_KEY" "$API/admin/features" > /tmp/features.json
          for id in $(python3 -c "import json;print(' '.join(f['id'] for f in json.load(open('/tmp/features.json'))['features']))"); do
            curl -fs -o /dev/null -X POST -H "X-Admin-Key: $ADMIN_KEY" -H 'content-type: application/json' -d '{"open":true}' "$API/admin/features/$id" || echo "could not open $id"
          done
          curl -fs "$API/features" | head -c 600; echo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            native/package-lock.json
            web/package-lock.json
      # The review's copy of the site: the game built for this run's API, served on 5173.
      - name: Site
        working-directory: web
        run: |
          npm ci
          VITE_API_URL=http://10.0.2.2:8080/api/v1 npx vite build --outDir /tmp/site
          nohup node ../native/review/serve.mjs /tmp/site 5173 > "$OUT/site.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:5173/jeu > /dev/null && break; sleep 1; done
          curl -fs http://localhost:5173/jeu | head -c 200; echo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci && npm install --no-save playwright-core@1.56.1
      - name: Firebase
        run: |
          cat > google-services.json <<JSON
          {"project_info":{"project_number":"115685300024","project_id":"babilife-38e39","storage_bucket":"babilife-38e39.firebasestorage.app"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:115685300024:android:9d87f4913fe5f373b3d3cd","android_client_info":{"package_name":"com.lifeinbabi.babi_life"}},
            "oauth_client":[],"api_key":[{"current_key":"AIzaSyCWL8bpyY5sPd7RhT-AopRpibfhbrIbsgY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
           "configuration_version":"1"}
          JSON
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: native/android
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: native
          script: bash review/run.sh
      - name: The app's JavaScript errors
        if: always()
        run: |
          MAP=$(ls android/app/build/generated/sourcemaps/react/release/*.map 2>/dev/null | head -1)
          [ -f "$OUT/logcat.txt" ] || exit 0
          cp "$MAP" "$OUT/bundle.map" 2>/dev/null || true
          python3 review/jslog.py "$OUT/logcat.txt" "$OUT/bundle.map" "$OUT/js-errors.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-review
          path: /tmp/review
          retention-days: 14
      # The screenshots also on the review-shots branch (one commit, replaced each time): a coding session that
      # can't reach Actions' downloads looks at them with git.
      - name: The screenshots on review-shots
        if: always() && github.ref == 'refs/heads/claude/modest-fermat-904lhi'
        working-directory: /tmp
        run: |
          mkdir -p /tmp/rshots && cp -r /tmp/review/shots /tmp/review/drive.log /tmp/review/steps.json /tmp/rshots/ 2>/dev/null || true
          cd /tmp/rshots && git init -q -b review-shots && git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Review of ${{ github.sha }} (${{ inputs.parts || 'login' }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" review-shots
