# The Android app (mobile/): checked and built on every change, the APKs
# kept as the run's artifacts (Actions → this run → « babi-life-apk »).
# The Google sign-in's web client ID comes from the repository's variables
# (Settings → Secrets and variables → Actions → Variables: GOOGLE_WEB_CLIENT_ID).
name: Mobile app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: babi-life-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
