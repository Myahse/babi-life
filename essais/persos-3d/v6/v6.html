// ---- the block figure: the game's joint layout (BlockHuman.tsx constants) -------------------------------------------
const B = { HEAD: 0.32, HIP_Y: 0.84, THIGH: 0.42, SHIN: 0.42, NECK_Y: 1.36, SHOULDER_Y: 1.3, UPPER_ARM: 0.25, FOREARM: 0.27, tw: 0.34, td: 0.18, lw: 0.166, ld: 0.16, aw: 0.13 }

  const bx = (w, h, d, c, x, y, z, p) => { if (!look) return; const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; p.add(m) }

  head.position.set(0, B.NECK_Y, 0); bx(B.HEAD, B.HEAD, B.HEAD, look?.skin, 0, B.HEAD / 2, 0, head); bx(B.HEAD * 1.1, B.HEAD * (look?.hairH || 0.34), B.HEAD * 1.1, look?.hair, 0, B.HEAD * (1.02 - (look?.hairH || 0.34) / 2 + 0.05), -0.01, head)
  for (const s of [-1, 1]) { bx(0.05, 0.05, 0.01, '#fff', s * 0.075, 0.17, B.HEAD / 2 + 0.003, head); bx(0.026, 0.035, 0.012, '#201008', s * 0.075, 0.168, B.HEAD / 2 + 0.006, head) } bx(0.1, 0.02, 0.012, '#5a1d18', 0, 0.075, B.HEAD / 2 + 0.004, head)

}

// ---- actors -----------------------------------------------------------------------------------------------------------

const src = await K.loadChar('./v2/koffi_anim.glb', 1.82)
const sport = (await K.loadGLB('./v6/koffi_sport.glb')).animations, CL = { run: (await K.loadGLB('./v6/koffi_running.glb')).animations[0], jump: sport[0], jumpOpen: sport[1], cheer: sport[2], fist: sport[3], slam: sport[5], idle: src.g.animations[0] }
const LOOKS = { koffi: { skin: '#6b3f22', shirt: '#f08a24', band: '#1f8a3b', shorts: '#27407a', shoes: '#f2f2f2', hair: '#0b0b0b', hairH: 0.5 }, awa: { skin: '#70402a', shirt: '#e8742a', shorts: '#0f5a4c', shoes: '#f39a3a', hair: '#0b0b0b', hairH: 0.42 } }
const FILES = { koffi: ['./v5/koffi5_rig.glb', 1.82], awa: ['./v3/awa24_rig.glb', 1.72] }
async function makeActor (kind, who, seed) {
  const a = { kind, who, seed, blk: makeBlock(kind === 'block' ? LOOKS[who] : null) }
  a.newPoser = () => { a.blk.reset(); a.pose = PR.makePoser(a.blk.rig, seed) }; a.newPoser()

const ball = () => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.12, 18, 12), mat('#d9641f', 0.6)); m.castShadow = true; scene.add(m); m.visible = false; return m }
const V = {}; for (const kind of (q.get('kinds') || 'block,adapt,plus').split(',')) V[kind] = { kind, A: await makeActor(kind, 'koffi', 3), D: await makeActor(kind, 'awa', 11), ball: ball(), u: -1 }

// ---- the scripted play (seconds) ---------------------------------------------------------------------------------------
const sm = (a, b, t) => { const u = Math.min(1, Math.max(0, (t - a) / (b - a))); return u * u * (3 - 2 * u) }

const LEN = 9.6, T_X = 2.0, T_SHOOT = 2.5, T_REL = T_SHOOT + 0.42, T_IN = T_REL + 0.8, T_BACK = 4.4, T_DUNK = 5.7, T_SLAM = T_DUNK + 0.66, T_CEL = 7.4
const script = (u) => {
  // attacker: pose, x, facing (rotation.y; +x is PI/2), speed, take
  let A, D
  if (u < T_X) A = { pose: 'dribble', x: -3.6 + 1.6 * u, ry: Math.PI / 2, speed: 2.4 }
  else if (u < T_SHOOT) A = { pose: 'crossover', x: -0.4, ry: Math.PI / 2 }
  else if (u < T_SHOOT + 0.95) A = { pose: 'shoot', x: -0.4, ry: Math.PI / 2 }
  else if (u < T_BACK) A = { pose: 'cheer', x: -0.4, ry: Math.PI / 2 - 0.5 }
  else if (u < T_DUNK) A = { pose: 'dribble', x: -0.4 + (3.3 + 0.4) * sm(T_BACK, T_DUNK, u) * 0.999, ry: Math.PI / 2, speed: 4.2, take: 1 }
  else if (u < T_CEL) A = { pose: 'dunk', x: 3.3, ry: Math.PI / 2 }
  else A = { pose: u < T_CEL + 1.3 ? 'airplane' : 'cheer', x: 3.3 - 2.6 * sm(T_CEL, T_CEL + 1.3, u), ry: lerp(-Math.PI / 2, 0, sm(T_CEL + 1.1, T_CEL + 1.5, u)), speed: 3 }
  if (u < T_X) D = { pose: 'guard', x: -2.3 + 1.6 * u * 0.95, ry: -Math.PI / 2 }
  else if (u < T_SHOOT + 0.1) D = { pose: u < T_X + 0.25 ? 'guard' : 'ankles', x: 0.75, ry: -Math.PI / 2 }
  else if (u < T_SHOOT + 0.9) D = { pose: 'block', x: 0.75, ry: -Math.PI / 2 }
  else if (u < T_BACK) D = { pose: 'guard', x: 0.75 + 0.9 * sm(3.4, T_BACK, u), ry: -Math.PI / 2 }
  else if (u < T_DUNK + 0.05) D = { pose: 'guard', x: 1.65 + 1.2 * sm(T_BACK, T_DUNK, u), ry: -Math.PI / 2, take: 1 }
  else if (u < T_DUNK + 0.9) D = { pose: 'block', x: 2.85, ry: -Math.PI / 2 + 0.25, take: 1 }
  else D = { pose: u < T_CEL ? 'guard' : 'despair', x: 2.85 - 0.5 * sm(T_CEL, T_CEL + 0.6, u), ry: -Math.PI / 2 + 0.6 }

const WT0 = 5000 // the frozen shared clock at u = 0
const REL = new THREE.Vector3(-0.22, 2.55, ZC + 0.12)
const hA = new THREE.Vector3(), hB = new THREE.Vector3(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3()

  const drib = (h) => { const top = Math.max(0.5, h.y - 0.02); b.set(h.x + dir * 0.16, R + (top - 2 * R) * Math.abs(Math.cos((WT0 + u + a.seed) * 7)), h.z) }

function step (v, u, dt) {

}
function present (v, u) {

  }

}
