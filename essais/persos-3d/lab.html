<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#87c6ef}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Meshy look test: Awa, Koffi, Tantie Adjoua (Meshy) next to Michelle (three.js example) in the block street.
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
const W = innerWidth, H = innerHeight
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
r.setSize(W, H); r.setPixelRatio(devicePixelRatio); r.shadowMap.enabled = true
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping
document.body.appendChild(r.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#9fd3f5'); scene.fog = new THREE.Fog('#9fd3f5', 25, 70)
const cam = new THREE.PerspectiveCamera(35, W / H, 0.1, 200)
scene.add(new THREE.HemisphereLight('#fff6e0', '#a0784f', 1.6))
const sun = new THREE.DirectionalLight('#fff1d6', 2.6); sun.position.set(6, 12, 8); sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 8, bottom: -8 }); sun.shadow.normalBias = 0.02; scene.add(sun)
const box = (w, h, d, c, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: c, roughness: .9 })); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m }
box(80, .1, 80, '#c8a678', 0, -.05, 0)
box(80, .12, 6, '#55555c', 0, 0, 4)
for (let i = -30; i < 30; i += 4) box(1.6, .02, .2, '#eee', i, .07, 4)
box(80, .25, 1.2, '#b9b2a6', 0, .12, .6)
const cols = ['#e9a84c', '#d9643a', '#f2e3c4', '#7fb0c9', '#e6c95a', '#9ccf7a']
for (let i = -6; i <= 6; i++) { const h = 3 + (i * 7 % 3 + 3) % 3; box(5.6, h, 5, cols[(i + 12) % cols.length], i * 6, h / 2, -3.2); box(1.2, 2, .1, '#5b3a22', i * 6 - 1, 1, -.68); box(1.4, 1, .1, '#cfe7f3', i * 6 + 1.4, 1.8, -.68) }
box(6, .2, 3, '#c0392b', 0, 3.1, -1.4)
for (let x of [-2.6, 2.6]) box(.15, 3, .15, '#6b4a2a', x, 1.5, 0)
box(1.2, .8, .8, '#8a5a35', -1.8, .4, .2); box(1.2, .8, .8, '#8a5a35', 3.2, .4, .4)

const q = new URLSearchParams(location.search)
const sitMode = q.get('shot') === 'sit'
const load = (url) => new Promise((ok, ko) => new GLTFLoader().load(url, ok, undefined, ko))
const Z = 2.2 // characters stand on the road edge, in front of the kerb
const chars = []
const fit = (o, height) => { o.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(o, true); const h = bb.max.y - bb.min.y; o.scale.multiplyScalar(height / h); return h }
const addMeshy = async (name, x, height, delay, danceName) => {
  const g = await load(`./${name}_anim.glb`); const w = await load(`./${name}_walking.glb`)
  const o = g.scene; o.traverse((c) => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; c.frustumCulled = false; c.material.side = THREE.FrontSide } }) // Meshy exports doubleSided, which gives shadow acne
  const holder = new THREE.Group(); holder.add(o); scene.add(holder)
  const mx = new THREE.AnimationMixer(o)
  const by = (n) => g.animations.find((a) => a.name.toLowerCase().includes(n))
  const walk = w.animations[0].clone()
  if (!window.__logged) { window.__logged = true; console.log('clips', g.animations.map((a) => a.name + ':' + a.duration.toFixed(2)).join(' '), '| walk tracks', walk.tracks.filter((t) => t.name.endsWith('.position')).map((t) => t.name + ' ' + Array.from(t.values.slice(0, 3)).map((v) => v.toFixed(2)) + ' -> ' + Array.from(t.values.slice(-3)).map((v) => v.toFixed(2))).slice(0, 3).join(' ; ')) }
  const clips = { walk, idle: by('idle'), wave: by('wave'), dance: g.animations[2], sit: by('sit') }
  const acts = {}
  for (const k in clips) { const a = mx.clipAction(clips[k]); a.play(); a.setEffectiveWeight(0); acts[k] = a }
  // measure height in idle pose
  acts.idle.setEffectiveWeight(1); mx.update(0); const h0 = fit(o, height); console.log(name, 'raw height', h0.toFixed(2))
  chars.push({ name, holder, mx, acts, clips, x, delay, meshy: true })
}
const addMichelle = async (x) => {
  const g = await load('./Michelle.glb'); const o = g.scene
  o.traverse((c) => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; c.frustumCulled = false } })
  const holder = new THREE.Group(); holder.add(o); scene.add(holder); fit(o, 1.7)
  const mx = new THREE.AnimationMixer(o); const a = mx.clipAction(g.animations.find((c) => c.name === 'SambaDance')); a.play()
  holder.position.set(x, 0.06, Z)
  chars.push({ name: 'michelle', holder, mx, samba: a, x })
}
await addMeshy('awa', -1.74, 1.68, 0, 'dance')
await addMeshy('koffi', -0.58, 1.8, 0.35, 'dance')
await addMeshy('adjoua', 0.58, 1.6, 0.7, 'dance')
await addMichelle(1.74)
if (sitMode) for (const c of chars) if (c.meshy) box(.5, .46, .5, '#8a5a35', c.x, .29, Z - .32)

const FADE = 0.35, SPEED = 1.25, WALK_T = 4.6
const pose = (c, t) => {
  if (!c.meshy) { c.samba.time = t % c.samba.getClip().duration; c.mx.update(0); return }
  const d = c.delay
  const segs = sitMode ? [['sit', 0]] : [['walk', -99], ['wave', WALK_T + d], ['idle', WALK_T + d + 4.1], ['dance', 11.6]]
  let i = 0; for (let k = 0; k < segs.length; k++) if (t >= segs[k][1]) i = k
  const w = i === 0 ? 1 : Math.min(1, (t - segs[i][1]) / FADE)
  for (const k in c.acts) c.acts[k].setEffectiveWeight(0)
  const set = (k, t0, wt) => { const a = c.acts[k]; const dur = c.clips[k].duration; a.time = ((t - Math.max(t0, 0)) % dur + dur) % dur; a.setEffectiveWeight(wt) }
  set(segs[i][0], segs[i][1], w); if (i > 0 && w < 1) set(segs[i - 1][0], segs[i - 1][1], 1 - w)
  c.mx.update(0)
  const arrive = WALK_T + d
  const x = !sitMode && t < arrive ? c.x - (arrive - t) * SPEED : c.x
  const turn = Math.min(1, Math.max(0, (t - arrive + 0.15) / 0.5)); const e = turn * turn * (3 - 2 * turn)
  c.holder.position.set(x, 0.06, Z); c.holder.rotation.y = sitMode ? 0 : (1 - e) * Math.PI / 2
}
const sm = (a, b, t) => { const u = Math.min(1, Math.max(0, (t - a) / (b - a))); return u * u * (3 - 2 * u) }
const lerp = (a, b, u) => a + (b - a) * u
const camera = (t) => {
  const shot = q.get('shot')
  if (shot === 'group' || shot === 'sit') { cam.position.set(0.4, 1.5, Z + (W > H ? 6.2 : 12)); cam.lookAt(0, 0.9, Z); return }
  if (shot) { const c = chars.find((c) => c.name === shot); const hy = { awa: 1.42, koffi: 1.5, adjoua: 1.33, michelle: 1.5 }[shot]; cam.position.set(c.x + 0.35, hy + 0.05, Z + 1.75); cam.lookAt(c.x, hy - 0.1, Z); return }
  // 0-4.6 wide tracking of the walk-in, then a close slide along the line, then pull back for the dance
  const u1 = sm(4.2, 6.2, t), u2 = sm(6.2, 11.4, t), u3 = sm(11.4, 13.4, t), u4 = sm(13.4, 19.6, t)
  let x = lerp(-3.4, -1.9, sm(0, 4.6, t)); let dist = 8.5, y = 1.35, ly = 0.95
  x = lerp(x, -1.74, u1); dist = lerp(dist, 4.3, u1)
  x = lerp(x, 1.74, u2)
  x = lerp(x, 1.3, u3); dist = lerp(dist, 5.6, u3)
  x = lerp(x, 0, u4); dist = lerp(dist, 12.2, u4)
  cam.position.set(x + 0.6 * Math.sin(t * 0.3), y, Z + dist); cam.lookAt(x, ly, Z)
}
let t = Number(q.get('t') || 0)
window.setTime = (tt) => { t = tt; for (const c of chars) pose(c, t); camera(t); r.render(scene, cam) }
window.ready = true
if (!q.has('rec')) { const clock = new THREE.Clock(); const loop = () => { window.setTime((t + clock.getDelta()) % 20); requestAnimationFrame(loop) }; loop() } else window.setTime(t)
</script></body></html>
