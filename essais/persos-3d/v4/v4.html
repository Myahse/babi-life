<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#87c6ef;font-family:system-ui,Arial,sans-serif}
#cap{position:absolute;left:0;right:0;top:5%;text-align:center;color:#fff;font-weight:800;font-size:34px;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6)}
#sub{position:absolute;left:4%;right:4%;top:11.5%;text-align:center;color:#fff;font-weight:600;font-size:20px;text-shadow:0 1px 0 #000,0 0 8px rgba(0,0,0,.7)}
</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body><div id="cap"></div><div id="sub"></div>
<script type="module">
import * as THREE from 'three'
import * as K from './kit.js'
import * as F4 from './face4.js'
const W = innerWidth, H = innerHeight, q = new URLSearchParams(location.search)
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
r.setSize(W, H); r.setPixelRatio(devicePixelRatio); r.shadowMap.enabled = true
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping
document.body.appendChild(r.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fd3f5'); scene.fog = new THREE.Fog('#9fd3f5', 25, 70)
const cam = new THREE.PerspectiveCamera(35, W / H, 0.1, 200)
scene.add(new THREE.HemisphereLight('#fff6e0', '#a0784f', 1.6))
const sun = new THREE.DirectionalLight('#fff1d6', 2.6); sun.position.set(6, 12, 8); sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 8, bottom: -8 }); sun.shadow.normalBias = 0.02; scene.add(sun)
const box = (w, h, d, c, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: c, roughness: .9 })); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m }
box(80, .1, 80, '#c8a678', 0, -.05, 0); box(80, .12, 6, '#55555c', 0, 0, 4)
for (let i = -30; i < 30; i += 4) box(1.6, .02, .2, '#eee', i, .07, 4)
box(80, .25, 1.2, '#b9b2a6', 0, .12, .6)
const cols = ['#e9a84c', '#d9643a', '#f2e3c4', '#7fb0c9', '#e6c95a', '#9ccf7a']
for (let i = -6; i <= 6; i++) { const h = 3 + (i * 7 % 3 + 3) % 3; box(5.6, h, 5, cols[(i + 12) % cols.length], i * 6, h / 2, -3.2); box(1.2, 2, .1, '#5b3a22', i * 6 - 1, 1, -.68); box(1.4, 1, .1, '#cfe7f3', i * 6 + 1.4, 1.8, -.68) }
box(6, .2, 3, '#c0392b', 0, 3.1, -1.4); for (let x of [-2.6, 2.6]) box(.15, 3, .15, '#6b4a2a', x, 1.5, 0)

const Z = 2.2, GY = 0.06
const FC = JSON.parse(q.get('fc') || '{}'), FC4 = JSON.parse(q.get('fc4') || '{}')
const atlas = new F4.FaceAtlas()
const C = {}, ORDER = ['awa', 'koffi', 'mariam', 'yao', 'adjoua'], NAME = { awa: 'Awa', koffi: 'Koffi', mariam: 'Mariam', yao: 'Yao', adjoua: 'Tantie Adjoua' }
const src = await K.loadChar('./v2/koffi_anim.glb', 1.82); C.koffi = src
const raw = { idle: src.g.animations[0], wave: src.g.animations[1], dance: src.g.animations[2] }
const prep = (key, ch) => { const t0 = performance.now(); K.findFace(ch, FC[key]); K.buildZones(ch); K.splitMaterial(ch); const d = F4.buildFace4(ch, atlas, FC4[key] || {}); ch.prepMs = performance.now() - t0; for (const k in raw) K.addClip(ch, k, K.shareClip(raw[k], src, ch)); scene.add(ch.holder); ch.holder.visible = false; ch.key = key; return ch }
C.awa = prep('awa', await K.loadChar('./v3/awa24_rig.glb', 1.72)); prep('koffi', src)
C.mariam = prep('mariam', await K.loadChar('./v3/body2_rig.glb', 1.72)); C.yao = prep('yao', await K.loadChar('./v3/yao_rig.glb', 1.25)); C.adjoua = prep('adjoua', await K.loadChar('./v2/adjoua_anim.glb', 1.62))
const cap = document.getElementById('cap'), sub = document.getElementById('sub')
const sm = (a, b, t) => { const u = Math.min(1, Math.max(0, (t - a) / (b - a))); return u * u * (3 - 2 * u) }
const lerp = (a, b, u) => a + (b - a) * u
const IT = (t) => 3.5 + 0.2 * Math.sin(t * 0.8)
const place = (ch, x, z = Z, ry = 0) => { ch.holder.visible = true; ch.holder.position.set(x, GY, z); ch.holder.rotation.y = ry }
const look = (px, py, pz, lx, ly, lz) => { cam.position.set(px, py, pz); cam.lookAt(lx, ly, lz) }
const tmp = new THREE.Vector3()
const E = F4.EXPR4
// expression cycle of a close-up, u in seconds
const SEQ = [[0.5, 'neutral', 'neutre'], [1.5, 'neutral', 'regards, clignements'], [2.1, 'smile', 'sourire'], [2.85, 'laugh', 'rire'], [3.7, 'talk', 'parle'], [4.2, 'sad', 'triste'], [4.7, 'surprised', 'surprise']]
const cycle = (ch, u, t) => {
  let prev = E.neutral, t0 = 0, cur = E.neutral, label = '', talking = false
  for (const [end, name, lab] of SEQ) { const ex = name === 'talk' ? E.neutral : E[name]; if (u < end) { cur = F4.mix4(prev, ex, sm(t0, t0 + 0.16, u)); label = lab; talking = name === 'talk'; break } prev = ex; t0 = end }
  const lv = F4.live(t, ORDER.indexOf(ch.key)); const st = { ...cur, ...lv }
  if (u < 0.5) { st.gx = 0; st.gy = 0; st.blink = 0 }
  if (u >= 0.5 && u < 1.5) { const v = u - 0.5; st.gx = v < 0.3 ? 0.9 : v < 0.55 ? -0.9 : v < 0.75 ? 0.2 : 0; st.gy = v < 0.3 ? 0.1 : v < 0.55 ? -0.2 : 0.3; const b1 = v - 0.62, b2 = v - 0.86; st.blink = Math.max(b1 >= 0 && b1 < 0.2 ? (b1 < 0.055 ? b1 / 0.055 : 1 - (b1 - 0.055) / 0.145) : 0, b2 >= 0 && b2 < 0.14 ? (b2 < 0.05 ? b2 / 0.05 : 1 - (b2 - 0.05) / 0.09) : 0) }
  if (talking) Object.assign(st, F4.viseme(u))
  if (label === 'rire') st.open = 0.6 + 0.2 * Math.sin(u * 30)
  ch.drawFace4(st); return label
}
const idleFace = (ch, t, ex = E.neutral) => ch.drawFace4({ ...ex, ...F4.live(t, ORDER.indexOf(ch.key)) })
const SEG = 4.7, T1 = SEG * 5, T2 = T1 + 3.6, TEND = T2 + 3.4
window.painted = (on) => { for (const k in C) C[k].face4Mesh.visible = !on }
let frame = 0
window.setTime = (t) => {
  frame++
  for (const k in C) C[k].holder.visible = false
  cap.textContent = ''; sub.textContent = ''
  if (t < T1) {
    const i = Math.min(4, Math.floor(t / SEG)), ch = C[ORDER[i]], u = t - i * SEG
    place(ch, 0); K.setPose(ch, { idle: 1 }, IT(t)); cap.textContent = NAME[ch.key]; sub.textContent = cycle(ch, u, t)
    ch.o.updateMatrixWorld(true); ch.bones.Head.getWorldPosition(tmp); const f = ch.face; const hy = GY + (f.ey + f.my) / 2
    look(0.05, hy + 0.02, Z + 0.78, 0, hy, Z)
  } else if (t < T2) {
    const u = t - T1, i = u < 1.8 ? 0 : 1, ch = C[ORDER[i]], v = u - i * 1.8
    const ang = v < 0.25 ? 0 : v < 0.75 ? lerp(0, 0.78, sm(0.25, 0.6, v)) : lerp(0.78, 1.42, sm(0.95, 1.3, v))
    place(ch, 0, Z, ang); K.setPose(ch, {}, 0); cap.textContent = NAME[ch.key]; sub.textContent = ang < 0.1 ? 'face' : ang < 1 ? 'trois-quarts' : 'profil'
    ch.drawFace4({ ...E.smile, ...F4.live(t, i), gx: 0.3 }); const f = ch.face; const hy = GY + (f.ey + f.my) / 2; look(0.05, hy + 0.02, Z + 0.85, 0, hy, Z)
  } else {
    const u = t - T2; cap.textContent = 'À distance de jeu'; sub.textContent = 'les cinq, visages animés (mise à jour 1 image sur 3)'
    ORDER.forEach((k, i) => { const ch = C[k]; place(ch, (i - 2) * 0.56, Z, 0); K.setPose(ch, i % 2 ? { wave: 1 } : { idle: 1 }, i % 2 ? u : IT(t + i)); if (frame % 3 === 0 || q.has('rec')) idleFace(ch, t, i === 1 ? E.smile : i === 3 ? E.laugh : E.neutral) })
    look(lerp(-0.4, 0.4, sm(0, 3.4, u)), 1.3, Z + 5.6, 0, 0.95, Z)
  }
  atlas.flush(); r.render(scene, cam)
}
// stills: close-up of one character with a given expression; mode 'painted' hides the overlay
window.faceShot = (k, expr, opts = {}) => {
  for (const kk in C) C[kk].holder.visible = false; cap.textContent = sub.textContent = ''
  const ch = C[k]; place(ch, 0, Z, opts.ry || 0); K.setPose(ch, { idle: 1 }, 3.4); ch.face4Mesh.visible = expr !== 'painted'
  ch.drawFace4({ ...(E[expr] || E.neutral), gx: opts.gx || 0, gy: opts.gy || 0, blink: 0 }); atlas.flush()
  const f = ch.face; const hy = GY + (f.ey + f.my) / 2; look(0.02, hy, Z + (opts.d || 0.75), 0, hy, Z); r.render(scene, cam)
  return { det: JSON.parse(JSON.stringify(ch.face4, (kk, v) => typeof v === 'number' ? +v.toFixed(2) : v)), tris: ch.face4Tris, prepMs: Math.round(ch.prepMs) }
}
window.debugFace = (k) => C[k].face4Debug()
window.atlasPNG = () => atlas.cv.toDataURL()
window.info = () => ({ calls: r.info.render.calls, tris: r.info.render.triangles, uploads: atlas.uploads })
window.C = C; window.TEND = TEND
window.ready = true
if (!q.has('rec')) { const clock = new THREE.Clock(); let t = Number(q.get('t') || 0); const loop = () => { t = (t + clock.getDelta()) % TEND; window.setTime(t); requestAnimationFrame(loop) }; loop() } else window.setTime(Number(q.get('t') || 0))
</script></body></html>
