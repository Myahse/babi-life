<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Samedi, c'est paiya — habillage</title>
<style>
  @font-face { font-family: 'Baloo'; src: url('../web/node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
  @font-face { font-family: 'Baloo'; src: url('../web/node_modules/@fontsource/baloo-2/files/baloo-2-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920" style="width: 540px; height: 960px"></canvas>
<script>
// What's drawn over the filmed game in « Samedi, c'est paiya ! » (paiya.mjs): the night's clock at the
// top, a label on each thing the game lets you do, the phone's cards (Gbairai, Bolide, Gnango), who
// speaks and what, and the end card. window.__frame(t) draws the moment t of the film.
const c = document.getElementById('c')
const g = c.getContext('2d')
const W = 1080, H = 1920
const AWA = '#ff7a00', KEKE = '#1d7cf2', NIGHT = '#0f1230', GOLD = '#ffc233', GREEN = '#00b86b', PINK = '#ff3d8b'
let PLAN = null
let QR = null
let LOGO = null
window.__setPlan = (plan, qr, logo) => {
  PLAN = plan
  if (qr) ((QR = new Image()), (QR.src = qr))
  if (logo) ((LOGO = new Image()), (LOGO.src = logo))
}
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3)
const back = (x) => {
  x = Math.min(1, Math.max(0, x))
  const s = 1.7
  return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2)
}

function round(x, y, w, h, r, fill) {
  g.beginPath()
  g.roundRect(x, y, w, h, r)
  g.fillStyle = fill
  g.fill()
}
function text(s, x, y, size, color, align = 'center', weight = 800, stroke = 0) {
  g.font = `${weight} ${size}px Baloo`
  g.textAlign = align
  g.textBaseline = 'middle'
  if (stroke) {
    g.lineWidth = stroke
    g.strokeStyle = 'rgba(0,0,0,0.55)'
    g.lineJoin = 'round'
    g.strokeText(s, x, y)
  }
  g.fillStyle = color
  g.fillText(s, x, y)
}
function width(s, size) {
  g.font = `800 ${size}px Baloo`
  return g.measureText(s).width
}
/** Lines of at most `max` px, broken on spaces. */
function wrap(s, size, max) {
  g.font = `800 ${size}px Baloo`
  const out = []
  let line = ''
  for (const w of s.split(' ')) {
    const t = line ? line + ' ' + w : w
    if (g.measureText(t).width > max && line) {
      out.push(line)
      line = w
    } else line = t
  }
  out.push(line)
  return out
}

const WHO = { awa: ['AWA', AWA], keke: ['KEKE', KEKE], atalaku: ['L’ATALAKU', PINK] }

/** Who speaks, what: a bubble low on the screen, the name in the speaker's colour. */
function caption(line, t) {
  const k = ease((t - line.from) / 0.18)
  const [who, col] = WHO[line.who]
  const rows = wrap(line.text.replace(/ ([?!:;»])/g, '\u00a0$1'), 62, 900)
  const h = 70 + rows.length * 74
  const y = (t >= PLAN.outro ? 1700 : 1430) - h / 2 + (1 - k) * 40
  g.globalAlpha = k
  round(70, y, 940, h, 40, 'rgba(15,18,48,0.82)')
  const tw = width(who, 40) + 60
  round(110, y - 30, tw, 62, 31, col)
  text(who, 110 + tw / 2, y + 1, 40, '#fff')
  rows.forEach((r, i) => text(r, 540, y + 70 + i * 74, 62, '#fff'))
  g.globalAlpha = 1
}

/** The night's clock, top centre; on each new hour the digits flip in. */
function clock(t) {
  let cur = PLAN.clock[0]
  for (const c of PLAN.clock) if (t >= c.from) cur = c
  const since = t - cur.from
  const pop = since < 0.35 ? 1 + 0.25 * Math.sin((since / 0.35) * Math.PI) : 1
  const night = t >= 16
  g.save()
  g.translate(540, 150)
  g.scale(pop, pop)
  round(-235, -56, 470, 112, 56, 'rgba(15,18,48,0.85)')
  // The little moon, or the sun going down.
  g.beginPath()
  g.arc(-170, 0, 26, 0, Math.PI * 2)
  g.fillStyle = t < 7.2 ? '#ffb347' : '#f4f1d0'
  g.fill()
  if (t >= 7.2) {
    g.beginPath()
    g.arc(-158, -8, 22, 0, Math.PI * 2)
    g.fillStyle = 'rgb(15,18,48)'
    g.fill()
  }
  text(cur.text, 40, 3, 70, night ? GOLD : '#fff')
  g.restore()
}

/** A label on what the game lets you do: tilted, sliding in from the left. */
function label(s, t) {
  const k = ease((t - s.from) / 0.3)
  const out = ease((t - (s.to - 0.25)) / 0.25)
  g.save()
  g.translate(540 - (1 - k) * 800 - out * 800, 300)
  g.rotate(-0.04)
  const w = width(s.text, 54) + 80
  round(-w / 2, -50, w, 100, 26, '#fff')
  round(-w / 2, -50, 22, 100, 11, PINK)
  text(s.text, 10, 3, 54, NIGHT)
  g.restore()
}

/** The phone's notification cards: an app icon, a title, a line; bouncing in from the top. */
function card(cd, t) {
  const k = back((t - cd.from) / 0.4)
  const out = ease((t - (cd.to - 0.3)) / 0.3)
  const y = 400 + (k - 1) * 260 - out * 500
  const shake = cd.app === 'gbairai' && t - cd.from < 1.2 ? Math.sin((t - cd.from) * 60) * 6 * (1 - (t - cd.from) / 1.2) : 0
  g.save()
  g.translate(shake, y)
  g.globalAlpha = Math.min(1, (t - cd.from) / 0.15) * (1 - out)
  g.shadowColor = 'rgba(0,0,0,0.35)'
  g.shadowBlur = 30
  round(90, 0, 900, 200, 44, 'rgba(255,255,255,0.97)')
  g.shadowBlur = 0
  const app = {
    gbairai: { col: GREEN, icon: 'G', name: 'GBAIRAI', title: 'Keke · message vocal', line: '« C’est paiya ce soir ! »', when: 'maintenant' },
    bolide: { col: '#e03131', icon: 'B', name: 'BOLIDE', title: 'Prestige limousine', line: 'Au garage · prête à rouler', when: 'Keke' },
    gnango: { col: '#fab005', icon: 'G', name: 'GNANGO', title: 'Ton chauffeur arrive', line: 'Berline blanche · 2 min', when: 'maintenant' },
  }[cd.app]
  round(125, 35, 130, 130, 32, app.col)
  text(app.icon, 190, 104, 90, '#fff')
  text(app.name, 290, 60, 34, app.col, 'left')
  text(app.when, 950, 60, 30, '#868e96', 'right', 700)
  text(app.title, 290, 110, 46, NIGHT, 'left')
  text(app.line, 290, 160, 38, '#495057', 'left', 700)
  g.restore()
  g.globalAlpha = 1
}

/** Confetti for the end card: gold and pink, falling, the same every take (seeded). */
const BITS = Array.from({ length: 70 }, (_, i) => {
  const r = (n) => ((Math.sin(i * 127.1 + n * 311.7) * 43758.5453) % 1 + 1) % 1
  return { x: r(1) * W, s: 120 + r(2) * 260, w: 14 + r(3) * 18, sp: r(4) * 6, c: [GOLD, PINK, '#fff', AWA, KEKE][i % 5], off: r(5) * H }
})
function confetti(t, from) {
  const e = t - from
  g.globalAlpha *= 0.75
  for (const b of BITS) {
    const y = ((b.off + e * b.s) % (H + 100)) - 50
    g.save()
    g.translate(b.x + Math.sin(e * 2 + b.sp) * 30, y)
    g.rotate(e * 3 + b.sp)
    g.fillStyle = b.c
    g.fillRect(-b.w / 2, -b.w / 4, b.w, b.w / 2)
    g.restore()
  }
}

/** The end card: the logo, « joue maintenant », the QR code, the address. */
function outro(t, from) {
  const k = ease((t - from) / 0.45)
  g.globalAlpha = k * 0.9
  g.fillStyle = NIGHT
  g.fillRect(0, 0, W, H)
  g.globalAlpha = k
  confetti(t, from)
  const s = back((t - from - 0.15) / 0.5)
  if (LOGO && LOGO.complete) {
    const lw = 760
    const lh = (LOGO.height / LOGO.width) * lw
    g.save()
    g.translate(540, 330)
    g.scale(s, s)
    g.drawImage(LOGO, -lw / 2, -lh / 2, lw, lh)
    g.restore()
  } else text('BABI LIFE', 540, 330, 150, AWA)
  g.globalAlpha = k * ease((t - from - 0.4) / 0.4)
  round(170, 530, 740, 130, 65, GOLD)
  text('joue maintenant', 540, 597, 80, NIGHT)
  text('Ton samedi soir, c’est ici !', 540, 735, 54, '#fff')
  if (QR && QR.complete) {
    round(330, 810, 420, 420, 30, '#fff')
    g.drawImage(QR, 350, 830, 380, 380)
  }
  text(PLAN.site, 540, 1300, 72, GOLD)
  g.globalAlpha = 1
}

window.__frame = (t) => {
  g.clearRect(0, 0, W, H)
  if (!PLAN) return
  if (t >= PLAN.outro) outro(t, PLAN.outro)
  else {
    clock(t)
    for (const s of PLAN.labels) if (t >= s.from && t < s.to) label(s, t)
    for (const cd of PLAN.cards) if (t >= cd.from && t < cd.to) card(cd, t)
  }
  for (const l of PLAN.lines) if (t >= l.from && t < l.to) caption(l, t)
}
window.__ready = document.fonts.load('800 40px Baloo').then(() => document.fonts.load('700 40px Baloo'))
</script>
</body>
</html>
