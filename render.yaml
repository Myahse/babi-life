# Render Blueprint for the Go API. The web app is deployed on Vercel.
services:
  - type: web
    name: ivoire-life-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID # same Firebase project as the web app
        sync: false
      - key: ALLOWED_ORIGINS # e.g. https://ivoire-life.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WAITLIST_ADMIN_KEY # to download the wish list (GET /api/v1/waitlist/export, header X-Admin-Key)
        generateValue: true
      - key: ADMIN_KEY # opens /admin: the pub, the reports and the wish list (each part's own key works too)
        generateValue: true
      - key: WHATSAPP_TOKEN # /admin, WhatsApp tab: Meta Cloud API token (WhatsApp Business), optional
        sync: false
      - key: WHATSAPP_PHONE_ID # the business number's Phone number ID in WhatsApp Manager
        sync: false
      - key: MODERATION_KEY # Gbairai's reports: GET /moderation/reports with X-Admin-Key
        generateValue: true
      # Babi Pub: the bucket where advertisers' posters and videos go (S3-compatible: Cloudflare R2 recommended)
      - key: ADS_ADMIN_KEY # to open /pub/admin (approve, refuse, mark paid)
        generateValue: true
      - key: ADS_S3_ENDPOINT # e.g. https://<account id>.r2.cloudflarestorage.com
        sync: false
      - key: ADS_S3_REGION # « auto » for R2
        sync: false
      - key: ADS_S3_BUCKET # e.g. babi-pub
        sync: false
      - key: ADS_S3_ACCESS_KEY
        sync: false
      - key: ADS_S3_SECRET_KEY
        sync: false
      - key: ADS_PUBLIC_URL # where players read the files: the bucket's public address (r2.dev or a custom domain)
        sync: false
      - key: BREVO_API_KEY # « mot de passe oublié » e-mails through Brevo's API (over HTTPS: Render's free plan blocks the SMTP ports); set this or SMTP_HOST, unset both: resets are off
        sync: false
      - key: SMTP_HOST # or any SMTP provider (Mailjet, Gmail app password…), on a plan that lets SMTP out
        sync: false
      - key: SMTP_PORT # usually 587
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM # e.g. Babi Life <noreply@lifeinbabi.com> (with Brevo: a sender or domain verified there)
        sync: false
      - key: GENIUSPAY_API_KEY # la boutique (backend shop/): the merchant's public key from GeniusPay's dashboard (pk_sandbox_… to test, pk_live_… to sell); unset: the shop shows, shut
        sync: false
      - key: GENIUSPAY_API_SECRET # its secret key (sk_…), never in the code
        sync: false
      - key: GENIUSPAY_WEBHOOK_SECRET # the webhook's secret (whsec_…); the webhook URL to give GeniusPay: <this API's address>/api/v1/shop/geniuspay
        sync: false
