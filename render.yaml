# Render Blueprint for the Go API. The web app is deployed on Vercel.
services:
  - type: web
    name: ivoire-life-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_ORIGINS # e.g. https://ivoire-life.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
